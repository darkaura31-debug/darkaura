<!DOCTYPE html>

<html lang="en">

<head>

    <!-- ==========================================
         META
    =========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DARKAURA | Preset</title>


    <!-- ==========================================
         STYLESHEET
    =========================================== -->

    <link
        rel="stylesheet"
        href="preset.css">


    <!-- ==========================================
         GOOGLE FONTS
    =========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- ==========================================
         FONT AWESOME
    =========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="header">

    <a
        href="index.html"
        class="logo">

        <img
            src="favicon.png"
            alt="DARKAURA Logo">

        <div class="logo-text">

            <h2>DARKAURA</h2>

            <span>XML PRESETS</span>

        </div>

    </a>

</header>


<!-- ==========================================
     PRESET SECTION
========================================== -->

<section class="preset">


    <!-- Back Button -->

    <a
        href="index.html"
        class="back-btn">

        <i class="fa-solid fa-arrow-left"></i>

        Back

    </a>


    <!-- Preset Thumbnail -->

    <img
        id="preset-thumb"
        class="preset-thumb"
        src=""
        alt="Preset Thumbnail">


    <!-- Preset Title -->

    <h1 id="preset-title"></h1>


    <!-- Preset Description -->

    <p id="preset-description"></p>
    <!-- ==========================================
         DOWNLOAD OPTIONS
    =========================================== -->

    <div class="download-grid">


        <!-- ======================================
             XML DOWNLOAD
        ======================================= -->

        <a
            id="xml-btn"
            class="download-card"
            href="#">

            <i class="fa-regular fa-file-code"></i>

            <h3>Download XML</h3>

        </a>


        <!-- ======================================
             QR CODE
        ======================================= -->

        <a
            id="qr-btn"
            class="download-card"
            href="#">

            <i class="fa-solid fa-qrcode"></i>

            <h3>Show QR Code</h3>

        </a>


        <!-- ======================================
             ALIGHT MOTION LINK
        ======================================= -->

        <a
            id="link-btn"
            class="download-card"
            href="#">

            <i class="fa-solid fa-link"></i>

            <h3>Open Alight Link</h3>

        </a>

    </div>

</section>


<!-- ==========================================
     FOOTER
========================================== -->

<footer class="footer">

    <p>

        © 2026 DARKAURA • Made with ❤️ by Diyorbek

    </p>

</footer>


<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script src="preset.js"></script>

</body>

</html>
